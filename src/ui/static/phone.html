<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenHaptic // Wireless Vision Node</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #000;
            color: #00f0ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100vw; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        #videoFeed {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        .hud-header {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 2;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.65); padding: 10px 16px; border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.4); backdrop-filter: blur(8px);
            font-size: 13px; font-weight: bold; letter-spacing: 1px;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ffcc00; display: inline-block; margin-right: 6px;
        }
        .controls {
            position: absolute; bottom: 30px; z-index: 2; display: flex; gap: 16px;
        }
        .btn {
            background: #00f0ff; color: #000; border: none; padding: 14px 28px; border-radius: 30px;
            font-weight: 900; font-size: 15px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); transition: all 0.2s ease;
        }
        .btn-flip {
            background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <video id="videoFeed" autoplay playsinline muted></video>

    <div class="hud-header">
        <div><span class="status-dot" id="statusDot"></span><span id="txtStatus">STANDBY</span></div>
        <div style="color: #888; font-size: 11px;">1080P/60FPS NODE</div>
    </div>

    <div class="controls">
        <button class="btn" id="btnConnect" onclick="toggleStream()">🚀 开始视频推流</button>
        <button class="btn btn-flip" onclick="flipCamera()">🔄 翻转镜头</button>
    </div>

    <script>
        let pc = null;
        let localStream = null;
        let isStreaming = false;
        let facingMode = "environment"; // Default back camera for whole-body pose capture

        async function initCamera() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 60, min: 30 }
                    },
                    audio: false
                });
                document.getElementById("videoFeed").srcObject = localStream;
            } catch (err) {
                console.error("Camera access failed: ", err);
                alert("无法访问摄像头，请检查权限！");
            }
        }

        async function toggleStream() {
            if (isStreaming) {
                if (pc) pc.close();
                isStreaming = false;
                document.getElementById("btnConnect").innerText = "🚀 开始视频推流";
                document.getElementById("btnConnect").style.background = "#00f0ff";
                document.getElementById("txtStatus").innerText = "DISCONNECTED";
                document.getElementById("statusDot").style.background = "#ff0055";
                return;
            }

            document.getElementById("txtStatus").innerText = "NEGOTIATING...";
            document.getElementById("statusDot").style.background = "#ffcc00";

            if (!localStream) await initCamera();

            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                if (state === "connected" || state === "completed") {
                    document.getElementById("txtStatus").innerText = "LIVE STREAMING";
                    document.getElementById("statusDot").style.background = "#00ff88";
                    document.getElementById("btnConnect").innerText = "⏹ 停止推流";
                    document.getElementById("btnConnect").style.background = "#ffcc00";
                    isStreaming = true;
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            try {
                const resp = await fetch('/api/webrtc_offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
                });
                const answer = await resp.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (e) {
                console.error("WebRTC Negotiation Failed: ", e);
                document.getElementById("txtStatus").innerText = "FAILED";
                document.getElementById("statusDot").style.background = "#ff0055";
            }
        }

        function flipCamera() {
            facingMode = (facingMode === "environment") ? "user" : "environment";
            initCamera().then(() => {
                if (isStreaming) {
                    // Replace video track seamlessly
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            });
        }

        // Auto-init on load
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>

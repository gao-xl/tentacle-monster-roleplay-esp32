<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Ultra-Low Latency Stream</title>
    <style>
        body {
            background: #06080e;
            color: #00f0ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden;
        }
        #localVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box; background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.85) 100%);
        }
        .hud-header {
            background: rgba(10,14,24,0.75); padding: 12px 18px; border-radius: 8px; border: 1px solid #00f0ff;
            font-size: 13px; display: flex; justify-content: space-between; backdrop-filter: blur(8px);
        }
        .controls { z-index: 3; pointer-events: auto; display: flex; gap: 14px; margin-bottom: 25px; }
        .btn {
            background: #00f0ff; color: #000; border: none; padding: 14px 28px; border-radius: 30px;
            font-weight: bold; font-size: 16px; box-shadow: 0 0 20px rgba(0,240,255,0.6); cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="localVideo" autoplay playsinline muted></video>

    <div class="hud-overlay">
        <div class="hud-header">
            <span>⚡ WebRTC: <span id="rtcStatus" style="color: #ffcc00;">IDLE</span></span>
            <span>GYRO: <span id="gyroTag">0° / 0°</span></span>
        </div>
        
        <div class="controls">
            <button class="btn" id="btnConnect" onclick="startWebRTC()">🚀 启动 WebRTC 极速推流</button>
            <button class="btn" style="background: #ff0055; color: #fff;" onclick="toggleCamera()">🔄 切换镜头</button>
        </div>
    </div>

    <script>
        let pc = null;
        let dataChannel = null;
        let localStream = null;
        let facingMode = "environment";
        let isRunning = false;

        let gyroData = { roll: 0, pitch: 0, yaw: 0, ax: 0, ay: 0, az: 0 };

        // Listen for High-Frequency Gyroscope
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                gyroData.roll = Math.round(e.gamma || 0);
                gyroData.pitch = Math.round(e.beta || 0);
                gyroData.yaw = Math.round(e.alpha || 0);
                document.getElementById("gyroTag").innerText = `${gyroData.roll}° / ${gyroData.pitch}°`;
                sendTelemetry();
            });
        }

        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (e) => {
                if (e.accelerationIncludingGravity) {
                    gyroData.ax = (e.accelerationIncludingGravity.x || 0).toFixed(2);
                    gyroData.ay = (e.accelerationIncludingGravity.y || 0).toFixed(2);
                    gyroData.az = (e.accelerationIncludingGravity.z || 0).toFixed(2);
                }
            });
        }

        async function initCamera() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
                audio: false
            });
            document.getElementById("localVideo").srcObject = localStream;
        }

        function toggleCamera() {
            facingMode = (facingMode === "user") ? "environment" : "user";
            initCamera();
        }

        async function startWebRTC() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }

            if (isRunning) {
                if (pc) pc.close();
                isRunning = false;
                document.getElementById("btnConnect").innerText = "🚀 启动 WebRTC 极速推流";
                document.getElementById("btnConnect").style.background = "#00f0ff";
                document.getElementById("rtcStatus").innerText = "CLOSED";
                return;
            }

            document.getElementById("rtcStatus").innerText = "CONNECTING...";
            await initCamera();

            pc = new RTCPeerConnection({
                iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
            });

            // Create 100Hz DataChannel for Gyro Telemetry
            dataChannel = pc.createDataChannel("telemetry", { ordered: false, maxRetransmits: 0 });
            dataChannel.onopen = () => {
                console.log("[DataChannel] Connected");
            };

            // Add Video Track
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                document.getElementById("rtcStatus").innerText = state.toUpperCase();
                if (state === "connected" || state === "completed") {
                    document.getElementById("rtcStatus").style.color = "#00ff88";
                    document.getElementById("btnConnect").innerText = "⏹ 停止 WebRTC 推流";
                    document.getElementById("btnConnect").style.background = "#ffcc00";
                    isRunning = true;
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Send Offer to Server
            const resp = await fetch('/api/webrtc_offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
            });
            const answer = await resp.json();
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }

        function sendTelemetry() {
            if (dataChannel && dataChannel.readyState === "open") {
                dataChannel.send(JSON.stringify({ type: "imu", data: gyroData }));
            }
        }

        initCamera();
    </script>
</body>
</html>

; PlatformIO Project Configuration for ESP32-C3 SuperMini
; OpenHaptic-Roleplay Universal Device Controller

[platformio]
default_envs = esp32c3_supermini

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 4MB Flash configuration with large app partition
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.flash_size = 4MB

; Native USB-CDC settings for ESP32-C3 SuperMini (Direct Type-C)
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_SUPERMINI_C3

monitor_speed = 115200
upload_speed = 921600

; Dependencies for BLE and Motor Control
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
